# tape 共用配置文件样例（record 与 replay 共用同一文件）
#
# 用法：
#   1) 复制为数据目录下的 tape-config.toml（默认 ./tape-api/，
#      或 --dir 指定目录），record / replay 都无需传 --config 即可自动加载；
#   2) 或放在任意位置，用 `tape record --config <file>` 或
#      `tape replay --config <file>` 显式指定（显式指定的文件必须存在）。
#
# 未提供配置文件（或数据目录下无 tape-config.toml）时：
#   - record：录制全部流量；
#   - replay：使用各参数的内置默认值。
#
# 取值优先级：命令行显式参数 > 配置文件 > 内置默认值。
# 例如 `tape replay --port 9999` 会覆盖配置文件里的 port。
#
# 两个表都可以省略，按需增删即可。

# ===========================================================================
# [record]：录制模式配置
# ===========================================================================
[record]
# 录制过滤：include_hosts 与 include_hosts_regex 取并集，任一命中即录制；
# 未匹配的请求仍正常转发，只是不落快照、不下载资源。
# 两项都不设置（或均为空数组）时录制全部流量。

# 精确匹配（字符串数组，可留空）：
#   - "host"        匹配该主机任意端口（如 "10.1.2.3" 命中 10.1.2.3:8080 / :9090）
#   - "host:port"   精确匹配该主机与端口（如 "api.company.com:8080" 不命中 :9090）
# 项可带 http:// / https:// 前缀，会被忽略；匹配时忽略大小写。
# include_hosts = ["10.1.2.3:8080", "api.company.com"]

# 正则匹配（字符串数组，可留空）：对完整 authority（host:port）做大小写不敏感匹配。
# 单引号为 TOML 字面字符串，不做转义，`\.` 原样传给正则引擎（匹配字面点号）；
# 若用双引号普通字符串则需写 `\\`。
# include_hosts_regex = [
#   '^10\.1\.2\.(3|4):\d+$',
#   '\.company\.com(:\d+)?$',
# ]

# ===========================================================================
# [replay]：重放模式配置
# ===========================================================================
[replay]
# 重放服务监听端口。取值 1-65535，默认 8888（与 record 一致，录制/重放两阶段
# APP 地址不变）；命令行 --port 优先。
# port = 8888

# 监听地址固定为 0.0.0.0（本机所有网卡），录制/重放均如此，供电视盒子等
# 局域网设备通过 tape 所在电脑的局域网 IP 直接访问（无需配置系统代理）。

# 响应改写模式。取值（大小写不敏感）：
#   - "relative"：把响应中引用本机地址的绝对 URL 改写为相对路径。
#     推荐：快照跨机器、换端口、换目录都能直接用；
#   - "absolute"：改写为绝对地址，URL 的主机部分替换为
#     absolute_base 配置的本地基地址。适合 APP 依赖固定域名/IP 的场景；
#   - "none"：不改写，原样返回录制的响应。
# 默认 "relative"；命令行 --rewrite 优先。
# rewrite = "relative"

# 仅 rewrite = "absolute" 时生效：改写后使用的本地基地址（URL 字符串）。
# 需包含协议、主机与端口，建议以 / 结尾，默认 http://127.0.0.1:8888/。
# 命令行 --absolute-base 优先。
# absolute_base = "http://127.0.0.1:8888/"
